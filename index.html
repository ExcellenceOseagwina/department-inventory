<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Department Inventory | Login Page</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="shortcut icon"
      href="assets/favicon/android-chrome-192x192.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="split-page">
      <section class="left">
        <div class="logo-container">
          <img
            class="logo"
            src="./assets/ChatGPT Image Aug 25, 2026, 02_01_29 AM.png"
            alt=""
          />
        </div>
        <h1>University Assets</h1>
        <div class="first-text-container">
          <p class="first-text">DEPARTMENTAL INVENTORY MANAGER</p>
        </div>
        <div class="second-text-container">
          <p class="second-text">
            Track equipment, furnitures, supplies, and assets conditions across
            the University from one workspace.
          </p>
        </div>
        <div class="buttons">
          <p class="btn-1 btn"><strong>8</strong> Departments</p>
          <p class="btn-2 btn"><strong>42</strong> Assets</p>
          <p class="btn-3 btn"><strong>5</strong> Low Stock</p>
        </div>
      </section>
      <section class="right">
        <fieldset class="login">
          <form action="">
            <legend>Staff Login</legend>
            <p class="details">Enter Your Login Details Below To Access The Inventory System.</p>
            <label for="username">Username</label>
            <input type="text" placeholder="admin" required />
            <label for="password">Password</label>
            <input type="password" placeholder="admin123" required />
            <button class="submit" type="submit">Login</button>
          </form>
        </fieldset>
      </section>
    </div>
  </body>
</html>
